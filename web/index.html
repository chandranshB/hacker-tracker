<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Real-time status tracker for target device 03e768e104ef026d">

  <!-- Mobile PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hacker Tracker">
  <meta name="theme-color" content="#0A0A0C">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hacker Tracker · 03e768e104ef026d</title>
  <link rel="manifest" href="manifest.json">

  <!-- Instant Preloader Styles (Zero Blank Flash) -->
  <style>
    body {
      background-color: #0A0A0C;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    .pulse-ring-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(0, 173, 181, 0.3);
      animation: pulse 1.6s ease-out infinite;
    }
    .core-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00ADB5;
      box-shadow: 0 0 16px #00ADB5;
    }
    .app-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #F4F4F5;
    }
    .loading-hint {
      font-size: 12px;
      color: #71717A;
      font-family: monospace;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Instant Preloader (Dismisses automatically when Flutter renders) -->
  <div id="loading-container">
    <div class="pulse-ring-wrap">
      <div class="pulse-ring"></div>
      <div class="core-dot"></div>
    </div>
    <div class="app-title">Hacker Tracker</div>
    <div class="loading-hint">Initializing telemetry engine...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('loading-container');
      if (el) {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }
    });
  </script>
</body>
</html>
