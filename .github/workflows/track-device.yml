name: Track C2 Device Status (03e768e104ef026d)

on:
  schedule:
    # Run every 30 minutes to track historical device data with minimal server load
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual Trigger Reason'
        required: false
        default: 'Manual on-demand check'

permissions:
  contents: write

concurrency:
  group: tracker-device-03e768e104ef026d
  cancel-in-progress: false

jobs:
  track:
    name: Fetch Telemetry & Record History
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: Safe Telemetry Fetch (Read-Only)
        run: |
          python tracker/track_device.py

      - name: Commit and Push Historical Updates
        run: |
          git config user.name "chandranshB"
          git config user.email "chandranshB@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "[*] No changes detected in telemetry or messages. Clean working directory."
          else
            echo "[+] Committing new historical telemetry data..."
            git commit -m "chore(telemetry): update device 03e768e104ef026d snapshot [skip ci]"
            git push
          fi
