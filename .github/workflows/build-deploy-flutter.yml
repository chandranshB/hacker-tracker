name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-deploy-flutter.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flutter-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Web Platform
        run: |
          flutter create . --platforms web

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build for GitHub Pages (/hacker-tracker/)
        run: |
          flutter build web --release --base-href /hacker-tracker/
          mkdir -p build/gh-pages
          cp -r build/web/* build/gh-pages/
          cp -r data build/gh-pages/data || true

      - name: Build for Cloudflare Pages (/)
        run: |
          flutter build web --release --base-href /
          mkdir -p build/cloudflare
          cp -r build/web/* build/cloudflare/
          cp -r data build/cloudflare/data || true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gh-pages

      - name: Publish Cloudflare Web to flutter-web branch
        run: |
          git config --global user.name "chandranshB"
          git config --global user.email "chandranshB@users.noreply.github.com"
          cd build/cloudflare
          git init -b flutter-web
          git add -A
          git commit -m "build(flutter): release web build for cloudflare [skip ci]"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin flutter-web

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
